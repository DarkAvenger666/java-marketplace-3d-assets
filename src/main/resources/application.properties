spring.datasource.url=jdbc:h2:file:./data/marketplace
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=48

app.storage.dir=./uploads
app.cors.allowed-origin=http://localhost:5173
